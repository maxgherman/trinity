apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: mandelbrot-source
    files:
      - index.html=app/index.html
      - server.js=app/server.js
  - name: mandelbrot-stage-urls
    literals:
      - AWS_STAGE_URL=
      - GCP_STAGE_URL=
      - AZURE_STAGE_URL=
