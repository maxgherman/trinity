apiVersion: apps/v1
kind: Deployment
metadata:
  name: mandelbrot
  namespace: mandelbrot
  labels:
    app.kubernetes.io/name: mandelbrot
    app.kubernetes.io/part-of: trinity
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mandelbrot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mandelbrot
        app.kubernetes.io/part-of: trinity
    spec:
      containers:
        - name: mandelbrot
          image: node:22-alpine
          imagePullPolicy: IfNotPresent
          command:
            - node
            - /app/server.js
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: CLOUD
              value: local
            - name: REGION
              value: local
            - name: STAGE_ROUTE
              value: aws,gcp,azure
            - name: STAGE_URL_CONFIG_DIR
              value: /config/stage-urls
            - name: FAIL_READY
              value: "false"
            - name: ERROR_RATE
              value: "0"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 750m
              memory: 384Mi
          volumeMounts:
            - name: app-source
              mountPath: /app
              readOnly: true
            - name: stage-urls
              mountPath: /config/stage-urls
              readOnly: true
      volumes:
        - name: app-source
          configMap:
            name: mandelbrot-source
        - name: stage-urls
          configMap:
            name: mandelbrot-stage-urls
            optional: true
