  - ../../base
images:
  - name: mandelbrot
    newName: 342863339545.dkr.ecr.us-east-1.amazonaws.com/trinity-dev-aws-mandelbrot
    newTag: sha-7402835a5f8e272372444f14417234b60600f04b
patches:
  - target:
      kind: Rollout
      name: mandelbrot
    patch: |-
      - op: replace
