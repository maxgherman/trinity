apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: observability
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: trinity
    app.kubernetes.io/component: metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: trinity
        app.kubernetes.io/component: metrics
    spec:
      initContainers:
        - name: render-prometheus-config
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              remote_write_url="$(cat /etc/grafana-cloud/url)"
              sed "s#__GRAFANA_CLOUD_REMOTE_WRITE_URL__#${remote_write_url}#g" \
                /etc/prometheus-template/prometheus.yml.template \
                > /etc/prometheus-generated/prometheus.yml
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus-template/prometheus.yml.template
              subPath: prometheus.yml.template
              readOnly: true
            - name: grafana-cloud-remote-write
              mountPath: /etc/grafana-cloud
              readOnly: true
            - name: prometheus-generated-config
              mountPath: /etc/prometheus-generated
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus-generated/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=6h
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          volumeMounts:
            - name: prometheus-generated-config
              mountPath: /etc/prometheus-generated/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - name: grafana-cloud-remote-write
              mountPath: /etc/grafana-cloud
              readOnly: true
            - name: prometheus-data
              mountPath: /prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
        - name: prometheus-generated-config
          emptyDir: {}
        - name: grafana-cloud-remote-write
          secret:
            secretName: grafana-cloud-remote-write
        - name: prometheus-data
          emptyDir: {}
