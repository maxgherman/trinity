apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: observability
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: trinity
    app.kubernetes.io/component: traces
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - name: query
      port: 16686
      targetPort: query
    - name: collector
      port: 14268
      targetPort: collector
    - name: zipkin
      port: 9411
      targetPort: zipkin
