apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: trinity
    app.kubernetes.io/component: metrics
    trinity.io/cloud: azure
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cloud: azure
        platform: trinity
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090
      - job_name: mandelbrot
        metrics_path: /metrics
        static_configs:
          - targets:
              - mandelbrot.mandelbrot.svc.cluster.local:80
            labels:
              service: mandelbrot

