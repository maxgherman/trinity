apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: trinity-require-container-resources
  annotations:
    policies.kyverno.io/title: Require Container Resources
    policies.kyverno.io/category: Trinity Baseline
    policies.kyverno.io/severity: medium
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-requests-and-limits
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - hello
                - mandelbrot
                - observability
                - secrets-demo
      validate:
        message: All containers and init containers must declare CPU and memory requests and limits.
        pattern:
          spec:
            =(initContainers):
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"
