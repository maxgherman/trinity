name: Secret Backends

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Secret backend operation to run.
        required: true
        default: apply
        type: choice
        options:
          - apply
          - delete
      cloud:
        description: Cloud backend to operate on.
        required: true
        default: all
        type: choice
        options:
          - all
          - aws
          - gcp
          - azure
      confirm_delete:
        description: Type DELETE to confirm a delete operation.
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: secret-backends
  cancel-in-progress: false

jobs:
  secret-backends:
    name: ${{ inputs.operation }} ${{ inputs.cloud }} secret backends
    runs-on: ubuntu-latest
    environment:
      name: infra-deploy-approval

    steps:
      - name: Check delete confirmation
        if: inputs.operation == 'delete' && inputs.confirm_delete != 'DELETE'
        run: |
          echo "Delete requires confirm_delete=DELETE."
          exit 1

      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run check

      - name: Configure AWS credentials
        if: inputs.cloud == 'all' || inputs.cloud == 'aws'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          role-session-name: trinity-secret-backends-${{ github.run_id }}

      - name: Configure GCP credentials
        if: inputs.cloud == 'all' || inputs.cloud == 'gcp'
        uses: google-github-actions/auth@v3
        with:
          project_id: trinity-k8s
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        if: inputs.cloud == 'all' || inputs.cloud == 'gcp'
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Azure credentials
        if: inputs.cloud == 'all' || inputs.cloud == 'azure'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Apply secret backends
        if: inputs.operation == 'apply'
        run: npm run apply:secret-backends -- --cloud "${{ inputs.cloud }}"
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Delete secret backends
        if: inputs.operation == 'delete'
        run: npm run delete:secret-backends -- --cloud "${{ inputs.cloud }}"
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
